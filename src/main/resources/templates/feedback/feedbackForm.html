<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'feedback')}">

<body>

  <h2 th:text="#{submitFeedback}">Submit Feedback</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="${message}"></span>
  </div>

  <form th:object="${feedback}" class="form-horizontal" id="feedback-form" method="post">
    <div class="form-group has-feedback">
      <input th:replace="~{fragments/inputField :: input (#{feedbackName}, 'name', 'text')}" />
      <input th:replace="~{fragments/inputField :: input (#{feedbackEmail}, 'email', 'text')}" />
      <div class="form-group" th:class="${#fields.hasErrors('message')} ? 'form-group has-error' : 'form-group'">
        <label th:for="message" class="col-sm-2 control-label" th:text="#{feedbackMessage}">Message</label>
        <div class="col-sm-10">
          <textarea th:field="*{message}" class="form-control" rows="5" th:errorclass="has-error"></textarea>
          <span th:if="${#fields.hasErrors('message')}" class="help-inline" th:errors="*{message}" th:text="#{error}">Error</span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" type="submit" th:text="#{submitFeedback}">Submit Feedback</button>
      </div>
    </div>
  </form>

  <script>
    function hideMessages() {
      setTimeout(function () {
        var el = document.getElementById("success-message");
        if (el) el.style.display = "none";
      }, 3000);
    }
    hideMessages();
  </script>

</body>

</html>
